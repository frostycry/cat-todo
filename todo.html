<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1730">
<title>cat & star to-do</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b1730; --panel:#251f45; --mid:#4a3f8f; --line:#6c5fc7; --lite:#a99cf2; --pale:#ece8ff;
  --px:'Press Start 2P','Courier New',monospace; --body:'VT323','Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{
  min-height:100%;color:var(--pale);font-family:var(--body);font-size:24px;line-height:1.1;
  padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  background-image:
    linear-gradient(rgba(169,156,242,.05) 50%,transparent 50%);
  background-size:100% 4px;
}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#sky svg{position:absolute;opacity:.35;animation:tw 2.4s steps(2) infinite}
@keyframes tw{50%{opacity:.08}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto}
.window{border:4px solid var(--lite);background:var(--panel);box-shadow:6px 6px 0 var(--mid);margin-bottom:22px}
.bar{display:flex;align-items:center;justify-content:space-between;background:var(--lite);color:var(--bg);
  font-family:var(--px);font-size:9px;padding:7px 8px}
.bar i{font-style:normal;letter-spacing:2px}
.hero{padding:18px 14px 16px;text-align:center}
.cats{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-bottom:14px}
.cats svg{display:block}
h1{font-family:var(--px);font-weight:400;font-size:19px;line-height:1.5;margin:0 0 6px;color:var(--pale);
  text-shadow:3px 3px 0 var(--mid)}
.sub{color:var(--lite);font-size:23px}
.meter{display:flex;gap:3px;margin:14px 0 6px;justify-content:center}
.meter b{width:100%;max-width:26px;height:16px;background:var(--bg);border:2px solid var(--line)}
.meter b.on{background:var(--lite);border-color:var(--pale)}
.count{font-family:var(--px);font-size:10px;color:var(--lite)}
ul{list-style:none;margin:0;padding:0}
li{padding:12px 12px 12px;border-top:3px dashed var(--mid)}
li:first-child{border-top:0}
.row{display:flex;gap:12px;align-items:flex-start}
.box{flex:none;width:34px;height:34px;padding:0;border:3px solid var(--lite);background:var(--bg);
  display:grid;place-items:center;cursor:pointer;color:var(--pale)}
.box svg{width:22px;height:22px;display:none}
.box.on{background:var(--mid)}
.box.on svg{display:block}
.box:focus-visible{outline:3px solid var(--pale);outline-offset:2px}
.txt{flex:1;padding-top:3px}
.txt small{display:block;color:var(--lite);font-size:21px;margin-top:3px}
.tag{font-family:var(--px);font-size:8px;color:var(--lite);white-space:nowrap;padding-top:8px}
.steps{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 0 46px}
.steps .box{width:26px;height:26px;border-width:2px}
.steps .box svg{width:16px;height:16px}
li.done .txt>span{text-decoration:line-through;text-decoration-thickness:2px;color:var(--lite)}
li.done .tag{color:var(--pale)}
.prizes{padding:12px;display:grid;gap:10px}
.prize{display:flex;gap:12px;align-items:center;padding:12px;border:3px solid var(--line);background:var(--bg);min-height:64px}
.prize svg{flex:none}
.prize .p{flex:1}
.prize.locked{border-style:dashed;color:var(--line)}
.prize.locked small{color:var(--line);display:block;font-size:20px;margin-top:2px}
.prize.open{border-color:var(--pale);background:var(--mid);box-shadow:4px 4px 0 var(--line)}
.prize.open .p{font-size:26px}
.prize.open small{display:block;color:var(--lite);font-size:20px;margin-top:2px}
.prize.fresh{animation:pop .5s steps(4) 1}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.prize.fresh{animation:none}}
.artwrap{display:block;margin-top:10px}
.art{display:block;image-rendering:pixelated}
.pic{position:relative;margin-top:10px;border:3px solid var(--pale);background:#fff;line-height:0;max-width:260px}
.pic img{width:100%;height:auto;display:block}
.pic span{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--px);font-size:9px;line-height:1.6;color:#251f45}
footer{text-align:center;font-family:var(--px);font-size:8px;line-height:1.8;color:var(--lite)}
button.reset{font-family:var(--px);font-size:8px;background:var(--bg);color:var(--lite);border:3px solid var(--line);
  padding:10px 12px;margin-top:12px;cursor:pointer}
button.reset:active{background:var(--mid);color:var(--pale)}
.win h1{animation:bob .8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){#sky svg,.win h1{animation:none}}
</style>
</head>

];
var LOCK=[".#####.","#.....#","#.....#","#######","#######","###.###","###.###","#######"];
var seen={};
var KEY='catstar-todo-v1',state={};
try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

var list=document.getElementById('list');
function render(){
  var html='',done=0;
  TASKS.forEach(function(k,i){
    var c=Math.min(state[i]||0,k.n),d=c===k.n;if(d)done++;
    html+='<li class="'+(d?'done':'')+'"><div class="row">';
    if(k.n===1){
      html+='<button class="box'+(c?' on':'')+'" data-i="'+i+'" data-j="0" role="checkbox" aria-checked="'+!!c+'" aria-label="'+k.t+'">'+check()+'</button>';
    }else{
      html+='<span class="box'+(d?' on':'')+'" style="cursor:default" aria-hidden="true">'+check()+'</span>';
    }
    html+='<div class="txt"><span>'+k.t+'</span>'+(k.s?'<small>'+k.s+'</small>':'')+'</div>';
    if(k.n>1)html+='<div class="tag">'+c+'/'+k.n+'</div>';
    html+='</div>';
    if(k.n>1){
      html+='<div class="steps">';
      for(var j=0;j<k.n;j++)html+='<button class="box'+(j<c?' on':'')+'" data-i="'+i+'" data-j="'+j+'" role="checkbox" aria-checked="'+(j<c)+'" aria-label="'+k.t+' step '+(j+1)+'">'+check()+'</button>';
      html+='</div>';
    }
    html+='</li>';
  });
  list.innerHTML=html;
  var pz='';
  TASKS.forEach(function(k,i){
    var d=(state[i]||0)>=k.n;
    if(d){
      var fresh=seen[i]===false;
      pz+='<div class="prize open'+(fresh?' fresh':'')+'">'+star(5,'#ece8ff')+'<div class="p">'+(REWARDS[i]||'Mystery reward')+'<small>from: '+k.t+'</small></div></div>';
    }else{
      pz+='<div class="prize locked">'+sprite(LOCK,4,'#6c5fc7','#6c5fc7')+'<div class="p">locked<small>finish: '+k.t+'</small></div></div>';
    }
    seen[i]=d;
  });
  document.getElementById('prizes').innerHTML=pz;
  var m='';for(var q=0;q<TASKS.length;q++)m+='<b class="'+(q<done?'on':'')+'"></b>';
  document.getElementById('meter').innerHTML=m;
  document.getElementById('count').textContent=done+' / '+TASKS.length+' done';
  var all=done===TASKS.length;
  document.getElementById('top').className='window'+(all?' win':'');
  document.getElementById('title').textContent=all?'all done! ★ meow':'my to-do list';
}
list.addEventListener('click',function(e){
  var b=e.target.closest('button.box');if(!b)return;
  var i=+b.dataset.i,j=+b.dataset.j,k=TASKS[i],c=state[i]||0;
  state[i]=(c===j+1)?j:j+1;
  save();render();
});
document.getElementById('reset').addEventListener('click',function(){
  if(confirm('Clear all checkmarks?')){state={};save();render();}
});
TASKS.forEach(function(k,i){seen[i]=(state[i]||0)>=k.n;});
render();
</script>
